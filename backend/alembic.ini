[alembic]
script_location = migrations
prepend_sys_path = .
# The real URL is read from the DATABASE_URL env var in migrations/env.py

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [alembic] %(message)s
